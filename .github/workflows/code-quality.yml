name: Code quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    name: black, flake8 and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Check formatting with Black
        run: black --check --diff coolprompt test src

      - name: Lint with Flake8
        run: flake8 coolprompt test src

      - name: Run unit tests
        run: pytest test -m "not integration and not maintainability"
