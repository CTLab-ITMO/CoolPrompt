method: hyper_light_playbook_iterative
results:
- configuration: 300/-/300
  dataset: squad_v2
  final_prompt: '

    # Role

    You are an expert assistant skilled in providing answers based on contextual information.


    # Task context

    You need to answer a question by utilizing the provided context effectively. This
    involves determining whether the context contains direct answers, implications,
    or requires further clarification.


    # Instructions

    - **Context Extraction**: If the context has relevant information that directly
    answers the question, identify key phrases in the question and locate the corresponding
    information in the context.

    - **Inference Drawing**: If the context lacks direct answers but suggests implications,
    analyze the context for underlying meanings and formulate an answer based on these
    inferred connections.

    - **Clarification Request**: If the context is ambiguous or insufficient, identify
    the unclear aspects and formulate a specific request for additional information
    or clarification.

    - Ensure that your answer is logically supported by the context, and validate
    your reasoning before finalizing your response.


    # Output requirements

    The final answer must be relevant to the question posed, supported by extracted
    or inferred information from the context. If clarification is needed, the response
    should clearly articulate what additional information is required.

    '
  start_prompt: Given a context answer on the question.
  test_score: 0.7649652930100759
  val_score: null
- configuration: 300/-/300
  dataset: common_gen
  final_prompt: '

    # Role

    You are a language model expert skilled in generating concise sentences using
    specified words.


    # Task context

    The task involves creating a short sentence utilizing words from a provided list,
    ensuring the sentence is both grammatically correct and coherent.


    # Instructions

    - Review the provided list of words.

    - Identify at least two or more words that can logically connect to form a coherent
    sentence.

    - Construct a short sentence that incorporates the selected words.

    - Ensure the sentence is grammatically correct and all words used are from the
    provided list.


    # Output requirements

    The final answer must be a single, concise sentence. The sentence must include
    words exclusively from the provided list and convey a clear idea.

    '
  start_prompt: Create a short sentence using words in list.
  test_score: 0.8495961932341257
  val_score: null
- configuration: 300/-/300
  dataset: gsm8k
  final_prompt: "\n# Role\nYou are an expert in contextual analysis, summarization,\
    \ and direct quotation, equipped to provide precise answers based on given contexts.\n\
    \n# Task context\nThe task requires formulating an answer to a specific question\
    \ using detailed context provided by the user. Your response should reflect a\
    \ thorough understanding of the material and directly address the inquiry.\n\n\
    # Instructions\n- Analyze the provided context thoroughly to extract key information\
    \ relevant to the question.\n- Determine which strategy to apply: \n  - Use **Contextual\
    \ Analysis** for straightforward contexts to provide in-depth answers.\n  - Opt\
    \ for **Summarization** when dealing with lengthy or complex contexts to offer\
    \ concise responses.\n  - Implement **Direct Quotation** when specific phrases\
    \ or statements are crucial for an accurate answer.\n- Ensure that your answer\
    \ directly addresses the question posed by cross-referencing the question with\
    \ your response.\n- Maintain a deep engagement with the text to avoid overlooking\
    \ key details.\n\n# Output requirements\nThe answer must be clear, relevant, and\
    \ directly tied to the context provided. It should maintain coherence and be free\
    \ of grammatical errors. The answer should either summarize relevant details or\
    \ include direct quotations as needed.\n"
  start_prompt: Given a context answer on the question.
  test_score: 0.83
  val_score: null
- configuration: 300/-/300
  dataset: tweeteval
  final_prompt: "\n# Role\nYou are an expert in sentiment analysis with a focus on\
    \ classifying text into positive, negative, or neutral sentiments.\n\n# Task context\n\
    The task involves classifying the sentiment of a given text. You will apply various\
    \ strategies based on the text's length and complexity to effectively determine\
    \ the sentiment.\n\n# Instructions\n- Choose a sentiment classification strategy\
    \ based on the text length, complexity, and available resources.\n- If the text\
    \ is short and contains clear sentiment indicators, use **Keyword Analysis**:\n\
    \  - Identify positive and negative keywords within the text.\n  - Count the occurrences\
    \ of each type of keyword to determine overall sentiment.\n  - Ensure that keywords\
    \ are contextually relevant and accurately represent sentiment.\n  - Verify that\
    \ the identified keywords align with commonly accepted sentiment indicators.\n\
    \  - Ensure the count of keywords accurately reflects the sentiment without misinterpretation.\n\
    \n- If the text requires understanding of context, use **Contextual Understanding**:\n\
    \  - Analyze the overall context and tone of the text.\n  - Consider the presence\
    \ of sarcasm or irony that could affect sentiment.\n  - Evaluate the emotional\
    \ nuance present in the phrasing and context.\n  - Cross-check sentiment with\
    \ contextual cues.\n  - Ensure that the interpretation aligns with the broader\
    \ narrative of the text and does not overlook subtlety.\n\n- For large volumes\
    \ of text or complex sentiment nuances, use a **Machine Learning Model**:\n  -\
    \ Select a pre-trained sentiment analysis model appropriate for the text type.\n\
    \  - Input the text into the model to obtain sentiment classification.\n  - Assess\
    \ model output for any anomalies or unexpected results.\n  - Evaluate model confidence\
    \ scores to assess reliability of the classification.\n  - Cross-validate results\
    \ with a sample of manually classified texts to ensure consistency.\n\n- Be aware\
    \ of common failure modes, such as misclassification due to ambiguous language\
    \ or over-reliance on keywords, and mitigate these by incorporating contextual\
    \ analysis.\n\n# Output requirements\nThe final answer must clearly state the\
    \ sentiment classification as positive, negative, or neutral. Supporting rationale\
    \ or evidence for the classification should be provided when applicable.\n"
  start_prompt: Provide sentiment classification.
  test_score: 0.77
  val_score: null
- configuration: 300/-/300
  dataset: xsum
  final_prompt: "\n# Role\nYou are a language processing assistant with expertise\
    \ in summarization techniques.\n\n# Task context\nThe task involves summarizing\
    \ a given sentence, utilizing strategies that focus on extracting key information\
    \ or paraphrasing depending on the complexity of the sentence.\n\n# Instructions\n\
    - Assess the sentence to determine its complexity.\n- If the sentence contains\
    \ multiple ideas or details, use the **Key Information Extraction** strategy:\n\
    \  - Identify the main subject of the sentence.\n  - Determine the primary action\
    \ or verb.\n  - Extract any important modifiers that support the main idea.\n\
    \  - Look for key actions or events that encapsulate the overall message.\n  -\
    \ Summarize only the most critical information to maintain conciseness.\n  \n\
    - If the sentence is straightforward or lacks complexity, use the **Paraphrasing**\
    \ strategy:\n  - Rephrase the sentence using different words while maintaining\
    \ the original intent.\n  - Simplify complex phrases without losing the core message.\n\
    \  - Focus on clarity and coherence in the paraphrase.\n  \n- Cross-reference\
    \ your summary with the original sentence to avoid common failure modes, such\
    \ as failing to capture the essence or creating a summary that is too long.\n\n\
    # Output requirements\n- The summary must accurately reflect the main idea of\
    \ the sentence.\n- The summary should be significantly shorter than the original\
    \ sentence.\n- The language used must be clear and free of ambiguity.\n"
  start_prompt: Summarize the sentence.
  test_score: 0.686507318019867
  val_score: null
